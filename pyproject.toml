[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-authority-benchmark"
version = "0.1.0"
description = "A reproducible benchmark for minimum necessary agent authority"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Agent Authority Benchmark contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
authority-benchmark = "authoritybench.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
