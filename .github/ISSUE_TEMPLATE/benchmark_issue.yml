name: Benchmark or harness issue
description: Report reproducible behavior that differs from the public protocol or observation contract.
title: "[Benchmark]: "
body:
  - type: markdown
    attributes:
      value: Use synthetic data only. Do not include credentials, private conversations, or production effects.
  - type: input
    id: revision
    attributes:
      label: Exact revision
      description: Commit SHA or release tag where the behavior occurs.
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Expected invariant
      description: Cite the protocol, schema, threat model, or observation rule.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include the smallest case or mutation and exact command output.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Affected boundary
      options:
        - Prevention
        - Detection
        - Remediation
        - Observation coverage
        - Receipt accuracy
        - Usefulness preservation
    validations:
      required: true
