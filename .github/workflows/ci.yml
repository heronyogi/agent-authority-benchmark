name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m authoritybench.cli run --quiet
      - run: python -m authoritybench.cli mutations --quiet
      - run: python scripts/generate_reference_result.py --check
